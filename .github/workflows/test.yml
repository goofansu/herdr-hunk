name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The manifest declares linux and macos, so both are tested. 3.9 is the
    # documented floor and 3.13 is current; the plugin uses only the standard
    # library, so there is nothing to install.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -t .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned: ruff's default rule set grows between releases, so an unpinned
      # linter turns an untouched repo red on someone else's release schedule.
      # Bump deliberately; `uvx ruff@0.16.2` reproduces this locally.
      - run: pip install ruff==0.16.2
      - run: ruff check .
      - run: ruff format --check .
