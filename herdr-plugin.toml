id = "herdr-hunk"
name = "Hunk Review"
version = "1.1.0"
min_herdr_version = "0.8.0"
description = "Opens a Hunk pane that watches for changes and closes when you quit Hunk"
platforms = ["linux", "macos"]

[[actions]]
id = "live-review"
title = "Review changes live in Hunk"
description = "Open a Hunk pane to the right that watches changes and closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "live-review"]

[[panes]]
id = "review"
title = "Hunk review"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-review"]
