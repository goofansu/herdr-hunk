id = "herdr-hunk"
name = "Hunk Review"
version = "1.0.1"
min_herdr_version = "0.8.0"
description = "Review live changes or the last commit in Hunk"
platforms = ["linux", "macos"]

[[actions]]
id = "review-live-changes"
title = "Review live changes in Hunk"
description = "Open a Hunk pane to the right that watches changes and closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-live-changes"]

[[actions]]
id = "review-last-commit"
title = "Review last commit in Hunk"
description = "Open a Hunk pane to the right that shows the last commit and closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-last-commit"]

[[panes]]
id = "review"
title = "Hunk live changes review"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-live-changes-review"]

[[panes]]
id = "last-commit-review"
title = "Hunk last commit review"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-last-commit-review"]
