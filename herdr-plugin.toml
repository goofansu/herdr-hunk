id = "herdr-hunk"
name = "Hunk Review"
version = "1.0.0"
min_herdr_version = "0.8.0"
description = "Open a self-closing Hunk diff beside a lone pane"
platforms = ["linux", "macos"]

[[actions]]
id = "review-changes"
title = "Review changes in Hunk"
description = "Open hunk diff to the right when this tab has one pane"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-changes"]

[[panes]]
id = "review"
title = "Hunk review"
placement = "split"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-review"]
