id = "herdr-hunk"
name = "Hunk Review"
version = "0.3.0"
min_herdr_version = "0.8.0"
description = "Opens temporary Hunk overlays for uncommitted changes, pull requests, or changes since the default branch"
platforms = ["linux", "macos"]

[[actions]]
id = "review-uncommitted-changes"
title = "Review uncommitted changes in Hunk"
description = "Open a temporary Hunk review overlay that shows uncommitted changes and closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-uncommitted-changes"]

[[actions]]
id = "review-pull-request"
title = "Review pull request in Hunk"
description = "Download and review the current branch's GitHub pull request in a temporary Hunk overlay; closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-pull-request"]

[[actions]]
id = "review-branch-changes"
title = "Review branch changes in Hunk"
description = "Open a temporary Hunk review overlay for committed and uncommitted changes since this branch diverged from the default branch; closes when you quit Hunk"
contexts = ["pane"]
command = ["python3", "herdr_hunk.py", "review-branch-changes"]

[[panes]]
id = "uncommitted-review"
title = "Uncommitted changes"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-uncommitted-changes-review"]

[[panes]]
id = "pull-request-review"
title = "Pull request"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-pull-request-review"]

[[panes]]
id = "branch-review"
title = "Branch changes"
placement = "overlay"
command = ["sh", "-c", "exec python3 \"$HERDR_PLUGIN_ROOT/herdr_hunk.py\" run-branch-changes-review"]
